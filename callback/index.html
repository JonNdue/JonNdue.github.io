<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tesla login complete</title>
<style>body{font-family:-apple-system,system-ui,sans-serif;max-width:560px;margin:40px auto;padding:0 20px}textarea{width:100%;height:120px;font-size:14px}button{font-size:18px;padding:10px 20px;margin-top:10px}</style></head>
<body><h2>Tesla login complete</h2><p id="msg">Copy the full link below and paste it back to Grok Bot.</p>
<textarea id="u" readonly></textarea><br><button onclick="navigator.clipboard.writeText(document.getElementById('u').value);this.textContent='Copied'">Copy</button>
<script>var u=document.getElementById('u');u.value=location.href;var p=new URLSearchParams(location.search);if(p.get('error')){document.getElementById('msg').textContent='Tesla returned an error: '+p.get('error')+'. Send this link to Grok Bot.';}</script>
</body></html>
